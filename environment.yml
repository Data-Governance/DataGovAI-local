name: rag
channels:
  - conda-forge
  - defaults
  - pytorch

dependencies:
  # Core Python
  - python=3.10
  - pip

  # Core ML
  - numpy=1.24.3  # Pin to stable 1.x version

  # Database
  - psycopg2  # PostgreSQL database adapter
  
  # System utilities
  - psutil

  # pip-installed packages
  - pip:
      # Core Libraries
      - openai>=1.0.0
      - python-dotenv>=1.0.0
      - pydantic>=2.0.0

      # Embeddings and Transformers
      - sentence-transformers>=4.0.0
      - transformers>=4.35.0
      - tiktoken>=0.3.0
      
      # Vector Database
      - pgvector>=0.2.0
            
      # Document Processing
      - pymupdf>=1.23.0
      - nltk
      - spacy>=3.0.0
      
      # DSPy Framework
      - dspy-ai>=2.6.17

      # UI - Upgraded Streamlit
      - streamlit>=1.30.0
      - streamlit-chat>=0.1.1
      - plotly>=5.16.0
            
      # Performance optimization
      - accelerate
      - bitsandbytes
      
      # Utilities
      - "numpy==1.24.3"  # Pin NumPy to a compatible version
      - "pandas<2.1.0"  # Use a version compatible with numpy 1.x
      - tenacity  # For retrying API calls 